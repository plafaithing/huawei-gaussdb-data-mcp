[project]
name = "mcp_server_gaussdb_data"
version = "0.1.0"
description = "MCP Server for Huawei Cloud GaussDB (data plane: in-database SQL for AI clients)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=2.0,<3",
    "huaweicloud-mcp-core>=1.0,<2",
    "sqlparse>=0.6,<0.7",
]

[project.scripts]
mcp_server_gaussdb_data = "mcp_server_gaussdb_data.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_gaussdb_data"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"


[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003（歧义 Unicode）：本项目注释/文档/用户可见文案为中文，全角标点是
# 刻意排版（与官方英文注释服务不同），不是同形字符混淆，故关闭这三条。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.10"

# sqlparse ships py.typed but leaves Statement.flatten and token_first unannotated;
# exclude it from disallow_untyped_calls when called from our strict-typed code.
untyped_calls_exclude = ["sqlparse"]

# sqlparse ships without type stubs (data-plane SQL classifier dependency).
[[tool.mypy.overrides]]
module = ["sqlparse.*"]
ignore_missing_imports = true
